<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dice Rolling Game</title>
</head>
<body>
    <div class="main-container">
        <h1>Dice Rolling Game</h1>
        <div class="container">
            <div class="dice" id="dice">
                <div class="face" id="front"><span style="margin-bottom: 60px;">.</span></div>
                <div class="face" id="back"><span style="margin-bottom: 90px;">..</span></div>
                <div class="face" id="left"><span style="margin-bottom: 90px;">...</span></div>
                <div class="face" id="right"><span style="margin-bottom: 40px;">::</span></div>
                <div class="face" id="top">:<span style="margin-bottom: 50px;">.</span>:</div>
                <div class="face" id="bottom"><span style="margin-top:-35px;">:::</span></div>
            </div>
        </div>
        <div class="players">
            <div id="player1" class="player-section active">
                <input type="text" id="player1-name" class="player-name" value="Player 1" maxlength="20">
                <div class="score-section">
                    <div>
                        <span class="score-label">Current Score:</span>
                        <span id="player1-current-score">0</span>
                    </div>
                    <div>
                        <span class="score-label">Saved Score:</span>
                        <span id="player1-saved-score">0</span>
                    </div>
                </div>
            </div>
            <div id="player2" class="player-section">
                <input type="text" id="player2-name" class="player-name" value="Player 2" maxlength="20">
                <div class="score-section">
                    <div>
                        <span class="score-label">Current Score:</span>
                        <span id="player2-current-score">0</span>
                    </div>
                    <div>
                        <span class="score-label">Saved Score:</span>
                        <span id="player2-saved-score">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="game-buttons">
        <button id="roll-btn" class="btn">Roll Dice</button>
        <button id="save-btn" class="btn">Save Score</button>
        <button id="reset-btn" class="btn">Reset Game</button>
    </div>

    <div id="winner-message" class="winner-message">
        <h2 id="winner-text"></h2>
    </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
